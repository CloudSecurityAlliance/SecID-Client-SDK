name: Release

# Publishes the Python and TypeScript packages when a maintainer pushes a
# release tag by hand. Nothing else triggers it — not pushes to main, not PRs.
#
#   python/vX.Y.Z      -> PyPI  csa-secid  (trusted publishing, OIDC)
#   typescript/vX.Y.Z  -> npm   @cloudsecurityalliance/secid (token + provenance)
#   go/vX.Y.Z          -> nothing to publish; the tag itself is the Go release.
#                         go-tag-check flags a bad tag after the fact.
#
# VERSION POLICY. The first step after checkout in every job that builds or
# publishes is scripts/check_release_version.py --tag. It refuses a tag whose
# version is not SemVer, does not match the version files, or is 1.0.0 or
# higher without an entry for that exact tag in RELEASE-APPROVALS.json. A
# refused tag builds and publishes nothing (python-publish needs python-build).
# Why: docs/incidents/2026-11-02-pypi-csa-secid-1.0.0.md. Rules: PUBLISHING.md,
# "Version policy".
#
# INERT UNTIL CONFIGURED. Each publish job is skipped unless its repository
# variable is set to "true" (Settings -> Secrets and variables -> Actions ->
# Variables), so pushing a tag before the registries are set up does nothing:
#   PYPI_PUBLISH_ENABLED  — after adding the PyPI trusted publisher
#   NPM_PUBLISH_ENABLED   — after adding the NPM_TOKEN secret
# Full setup steps: PUBLISHING.md, "Automated publishing".
#
# Actions are pinned by commit SHA (tag in the trailing comment).

on:
  push:
    tags:
      - "python/v*"
      - "typescript/v*"
      - "go/v*"

permissions: {}

jobs:
  python-build:
    name: Build Python distribution
    if: startsWith(github.ref_name, 'python/v') && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version policy
        working-directory: .
        run: python3 -I scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Check the tagged commit is on main
        working-directory: .
        run: |
          git fetch --no-tags https://github.com/${GITHUB_REPOSITORY}.git +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tagged commit $(git rev-parse HEAD) is not an ancestor of origin/main"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check the tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#python/v}"
          code="$(python -c 'import secid_client; print(secid_client.__version__)')"
          if [ "$tag" != "$code" ]; then
            echo "::error::Tag says $tag but secid_client.__version__ is $code"
            exit 1
          fi
      - name: Test
        run: pip install pytest && pytest test_secid_client.py -q
      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  python-publish:
    name: Publish to PyPI
    needs: python-build
    runs-on: ubuntu-latest
    # The PyPI trusted publisher must name this environment. Add required
    # reviewers to it in Settings -> Environments for a manual approval gate.
    environment:
      name: pypi
      url: https://pypi.org/project/csa-secid/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm-publish:
    name: Publish to npm
    if: startsWith(github.ref_name, 'typescript/v') && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@cloudsecurityalliance/secid
    permissions:
      contents: read
      id-token: write # required for npm --provenance
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version policy
        working-directory: .
        run: python3 -I scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Check the tagged commit is on main
        working-directory: .
        run: |
          git fetch --no-tags https://github.com/${GITHUB_REPOSITORY}.git +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tagged commit $(git rev-parse HEAD) is not an ancestor of origin/main"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#typescript/v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag says $tag but package.json version is $pkg"
            exit 1
          fi
      - run: npm ci
      - run: npm test # also asserts VERSION in secid-client.ts == package.json
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  go-tag-check:
    # A go/vX.Y.Z tag IS the Go release: proxy.golang.org can fetch and cache
    # it as soon as anyone asks, so no workflow can stop it. This job runs the
    # same check after the fact and fails loudly, so a bad tag is seen at once.
    # Only a tag ruleset (a repository setting) can prevent one; see
    # docs/incidents/2026-11-02-pypi-csa-secid-1.0.0.md.
    name: Check Go release tag (after the fact)
    if: startsWith(github.ref_name, 'go/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check release version policy
        run: python3 -I scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Say what to do about the tag
        if: failure()
        run: |
          echo "::error title=Go release tag breaks the version policy::$GITHUB_REF_NAME is a published Go release, and the module proxy may already have cached it. See the job summary."
          {
            echo "## Go release tag breaks the version policy"
            echo
            echo "The tag is the release, so the Go module proxy may already have cached it."
            echo "Do not move or re-push it. Instead:"
            echo
            echo "1. Retract it in \`go/go.mod\` and publish the retraction, as was done for v1.0.0 and v1.0.1"
            echo "   (docs/incidents/2026-11-02-pypi-csa-secid-1.0.0.md). If the retraction needs a tag of"
            echo "   1.0.0 or higher, Kurt must approve that tag in RELEASE-APPROVALS.json first."
            echo "2. Write an incident record in docs/incidents/ and raise it with the program's governing agent."
          } >> "$GITHUB_STEP_SUMMARY"
