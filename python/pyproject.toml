[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expression support
build-backend = "hatchling.build"

[project]
# PyPI has a flat namespace, so the distribution name carries the org prefix.
# The import module (secid_client) and the CLI command (secid) stay simple.
name = "cloudsecurityalliance-secid"
dynamic = ["version"]  # read from __version__ in secid_client.py
description = "Resolve security identifiers to URLs using the SecID API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Cloud Security Alliance", email = "research@cloudsecurityalliance.org" },
]
keywords = ["security", "cve", "vulnerability", "secid", "cybersecurity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
secid = "secid_client:main"

[project.urls]
Homepage = "https://github.com/CloudSecurityAlliance/SecID"
Repository = "https://github.com/CloudSecurityAlliance/SecID-Client-SDK"
Documentation = "https://secid.cloudsecurityalliance.org"
Issues = "https://github.com/CloudSecurityAlliance/SecID-Client-SDK/issues"

[tool.hatch.version]
path = "secid_client.py"

[tool.hatch.build.targets.wheel]
only-include = ["secid_client.py"]
